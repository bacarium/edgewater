<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgewater 3D Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 900px; /* Widened slightly to give both viewers room */
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Grid layout to put them side-by-side on desktop, stacked on mobile */
        .viewer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .viewer-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
        }

        iframe {
            width: 100%;
            height: 450px; /* Adjusted height for side-by-side viewing */
            border: 2px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Specimen Showcase</h1>
        <p>Explore the 3D collection below. You can click and drag inside either window to rotate the models.</p>
        
        <div class="viewer-grid">
            
            <div class="viewer-card">
                <h3>Castor canadensis (Beaver) Cranium</h3>
                <iframe src="/edgewater/beaver.html" title="Beaver Viewer"></iframe>
            </div>

            <div class="viewer-card">
                <h3>Mammuthus (Mammoth) Specimen</h3>
                <iframe src="/edgewater/mammoth.html" title="Mammoth Viewer"></iframe>
            </div>

        </div>
        
    </div>

</body>
</html>
