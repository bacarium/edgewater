<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgewater 3D Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* This changes the iframe from full-screen to an embedded box */
        iframe {
            width: 100%;
            height: 500px; /* Gives it a fixed height */
            border: 2px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Specimen Showcase</h1>
        <p>Below is an embedded 3D viewer showing the <em>Castor canadensis</em> Cranium.</p>
        
        <iframe src="/edgewater/beaver.html" title="Beaver Viewer"></iframe>
        
        <p>You can click and drag inside the box above to rotate the skull.</p>
    </div>

</body>
</html>
